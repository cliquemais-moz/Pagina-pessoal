<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="QuizApp - Quiz interativo de perfil">
  <title>QuizApp - Perfil Interativo</title>

  <!-- Tailwind CSS via CDN: this file works as a standalone HTML page -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f3f4f6;
    }
    button, input { font-family: inherit; }
    button { -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn .35s ease both; }
    .slide-up { animation: slideUp .4s ease both; }
    .pulse-soft { animation: pulseSoft 1.6s ease-in-out infinite; }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulseSoft {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <script>
    // =========================================================
    // CONFIGURAÇÃO
    // =========================================================

    // COLOQUE AQUI O LINK DO SEU VÍDEO.
    // Exemplos:
    // YouTube: https://www.youtube.com/embed/SEU_ID
    // Vturb: use o URL de iframe fornecido pelo Vturb.
    const VIDEO_EMBED_URL = "https://www.youtube.com/embed/SEU_VIDEO_AQUI";

    const topics = [
      { name: "Tecnologia", icon: "💻" },
      { name: "Esportes", icon: "⚽" },
      { name: "Negócios", icon: "💼" },
      { name: "Arte", icon: "🎨" },
      { name: "Ciência", icon: "🔬" },
      { name: "Música", icon: "🎵" },
      { name: "Educação", icon: "📚" },
      { name: "Viagens", icon: "✈️" }
    ];

    const steps = [
      "Identificação",
      "Conhecimento",
      "Interesse",
      "Confirmação",
      "Resultado"
    ];

    // =========================================================
    // ESTADO
    // =========================================================

    const state = {
      step: 1,
      form: {
        name: "",
        email: "",
        category: "Geral",
        topic: "",
        username: ""
      },
      attempt: 0,
      answerStatus: null,
      selectedNumber: null,
      processIndex: 0
    };

    let processingTimers = [];

    // =========================================================
    // HELPERS
    // =========================================================

    function escapeHTML(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function updateForm(field, value) {
      state.form[field] = value;
      render();
    }

    function progressPercent() {
      if (state.step === 1) return 20;
      if (state.step === 2) return 40;
      if (state.step === 3) return 60;
      if (state.step === 4) return 80;
      if (state.step === 5) return 100;
      return 0;
    }

    function currentStepNumber() {
      return typeof state.step === "number" ? state.step : 0;
    }

    function setStep(step) {
      state.step = step;
      render();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // =========================================================
    // COMPONENTES
    // =========================================================

    function header() {
      return `
        <header class="border-b border-gray-100 bg-white px-5 py-5 sm:px-7">
          <div class="flex items-center justify-between">
            <div class="flex items-center gap-2">
              <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-xl text-white shadow-sm">
                ★
              </div>
              <div>
                <h1 class="text-lg font-bold text-gray-900">QuizApp</h1>
                <p class="text-xs text-gray-500">Perfil Interativo</p>
              </div>
            </div>

            ${
              state.step !== 1 && state.step !== "processing"
                ? `<div class="rounded-full bg-green-50 px-3 py-1.5 text-xs font-semibold text-green-600">
                    Etapa ${state.step} de 5
                   </div>`
                : ""
            }
          </div>
        </header>
      `;
    }

    function progressBar() {
      if (state.step === "processing") return "";

      const percent = progressPercent();

      return `
        <div class="px-5 pt-5 sm:px-7">
          <div class="mb-2 flex justify-between text-[10px] font-medium uppercase tracking-wide text-gray-400">
            <span>Progresso</span>
            <span>${percent}%</span>
          </div>

          <div class="h-2 overflow-hidden rounded-full bg-gray-100">
            <div
              class="h-full rounded-full bg-green-500 transition-all duration-500"
              style="width:${percent}%"
            ></div>
          </div>

          <div class="mt-3 grid grid-cols-5 gap-1">
            ${steps.map((item, index) => {
              const active = index + 1 <= currentStepNumber();
              return `
                <div class="text-center text-[9px] ${
                  active ? "font-semibold text-green-600" : "text-gray-400"
                }">
                  ${item}
                </div>
              `;
            }).join("")}
          </div>
        </div>
      `;
    }

    function footer() {
      return `
        <footer class="border-t border-gray-100 px-5 py-5 text-center">
          <p class="text-xs text-gray-400">
            © 2026 QuizApp. Todos os direitos reservados.
          </p>
        </footer>
      `;
    }

    function layout(content, options = {}) {
      const wide = options.wide ? "max-w-3xl" : "max-w-xl";

      return `
        <div class="min-h-screen bg-gray-100 px-4 py-6 sm:py-10">
          <div class="mx-auto w-full ${wide} overflow-hidden rounded-2xl bg-white shadow-xl">
            ${header()}
            ${progressBar()}
            <main class="px-5 py-7 sm:px-7 sm:py-9">
              ${content}
            </main>
            ${footer()}
          </div>
        </div>
      `;
    }

    // =========================================================
    // ETAPA 1
    // =========================================================

    function renderStep1() {
      return `
        <section class="fade-in">
          <div class="mb-7 text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-50 text-3xl">
              👋
            </div>

            <h2 class="text-2xl font-bold text-gray-900">
              Bem-vindo ao Nosso Quiz!
            </h2>

            <p class="mt-2 text-sm leading-6 text-gray-500">
              Preencha seus dados para começar a responder.
            </p>
          </div>

          <form id="startForm" class="space-y-5">

            <div>
              <label class="mb-2 block text-sm font-semibold text-gray-700">
                Nome Completo
              </label>

              <input
                id="name"
                type="text"
                value="${escapeHTML(state.form.name)}"
                placeholder="Digite seu nome"
                required
                class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3.5 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
              />
            </div>

            <div>
              <label class="mb-2 block text-sm font-semibold text-gray-700">
                E-mail
              </label>

              <input
                id="email"
                type="email"
                value="${escapeHTML(state.form.email)}"
                placeholder="seuemail@exemplo.com"
                required
                class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-3.5 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
              />
            </div>

            <div>
              <label class="mb-3 block text-sm font-semibold text-gray-700">
                Qual categoria representa melhor seu interesse?
              </label>

              <div class="space-y-3">
                ${["Geral", "Avançada", "Especialista"].map(category => `
                  <label class="flex cursor-pointer items-center rounded-xl border p-4 transition ${
                    state.form.category === category
                      ? "border-indigo-500 bg-indigo-50"
                      : "border-gray-200 bg-white hover:border-gray-300"
                  }">
                    <input
                      type="radio"
                      name="category"
                      value="${category}"
                      ${state.form.category === category ? "checked" : ""}
                      class="h-4 w-4 accent-indigo-600"
                    />
                    <span class="ml-3 text-sm font-medium text-gray-700">
                      Categoria ${category}
                    </span>
                  </label>
                `).join("")}
              </div>
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-indigo-600 py-4 text-sm font-bold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700 active:scale-[0.98]"
            >
              INICIAR QUIZ
            </button>
          </form>
        </section>
      `;
    }

    // =========================================================
    // ETAPA 2
    // =========================================================

    function renderStep2() {
      let feedback = "";

      if (state.answerStatus === "wrong") {
        feedback = `
          <div class="mb-5 rounded-xl border border-red-100 bg-red-50 p-4">
            <p class="text-sm font-semibold text-red-600">
              Resposta incorreta.
            </p>

            <p class="mt-1 text-xs text-red-500">
              Você tem mais 1 tentativa!
            </p>

            <button
              id="retryBtn"
              class="mt-3 rounded-lg bg-red-500 px-4 py-2 text-xs font-bold text-white hover:bg-red-600"
            >
              TENTAR NOVAMENTE
            </button>
          </div>
        `;
      }

      if (state.answerStatus === "correct") {
        feedback = `
          <div class="mb-5 rounded-xl border border-green-200 bg-green-50 p-4">
            <p class="text-sm font-bold text-green-600">
              ✓ Resposta correta!
            </p>

            <p class="mt-1 text-xs text-green-600">
              Avançando...
            </p>
          </div>
        `;
      }

      return `
        <section class="fade-in">
          <div class="mb-6">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">
              ETAPA 2 DE 5 · Pergunta de Conhecimento
            </span>

            <h2 class="mt-3 text-2xl font-bold text-gray-900">
              Olá, ${escapeHTML(state.form.name)}!
            </h2>

            <p class="mt-2 text-sm leading-6 text-gray-500">
              Escolha o número correspondente à opção correta para avançar.
            </p>
          </div>

          ${feedback}

          <div class="grid grid-cols-2 gap-3 sm:grid-cols-5">
            ${Array.from({ length: 10 }, (_, index) => {
              const number = index + 1;
              let classes = "border-gray-200 bg-white text-gray-700 hover:border-indigo-400 hover:bg-indigo-50 hover:text-indigo-600";

              if (state.selectedNumber === number) {
                if (state.answerStatus === "wrong") {
                  classes = "border-red-400 bg-red-50 text-red-600";
                } else if (state.answerStatus === "correct") {
                  classes = "border-green-400 bg-green-50 text-green-600";
                } else {
                  classes = "border-indigo-500 bg-indigo-50 text-indigo-600";
                }
              }

              return `
                <button
                  data-answer="${number}"
                  ${state.answerStatus === "correct" ? "disabled" : ""}
                  class="flex aspect-square items-center justify-center rounded-xl border text-lg font-bold transition ${classes}"
                >
                  ${number}
                </button>
              `;
            }).join("")}
          </div>

          <div class="mt-7 rounded-xl bg-gray-50 p-4 text-center">
            <p class="text-xs text-gray-500">
              Tentativa atual:
              <strong class="text-gray-700">
                ${state.attempt + 1} de 2
              </strong>
            </p>
          </div>
        </section>
      `;
    }

    // =========================================================
    // ETAPA 3
    // =========================================================

    function renderStep3() {
      return `
        <section class="fade-in">
          <div class="mb-6">
            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">
              ETAPA 3 DE 5
            </span>

            <h2 class="mt-3 text-2xl font-bold text-gray-900">
              Selecione seu Tópico de Interesse
            </h2>

            <p class="mt-2 text-sm leading-6 text-gray-500">
              Escolha uma opção para continuar.
            </p>
          </div>

          <div class="grid grid-cols-2 gap-3">
            ${topics.map(topic => `
              <button
                data-topic="${topic.name}"
                class="rounded-2xl border p-5 text-left transition hover:-translate-y-0.5 hover:border-indigo-400 hover:bg-indigo-50 ${
                  state.form.topic === topic.name
                    ? "border-indigo-500 bg-indigo-50"
                    : "border-gray-200 bg-white"
                }"
              >
                <div class="mb-3 text-3xl">${topic.icon}</div>
                <p class="text-sm font-bold text-gray-800">${topic.name}</p>
                <p class="mt-1 text-xs text-gray-400">Selecionar</p>
              </button>
            `).join("")}
          </div>
        </section>
      `;
    }

    // =========================================================
    // ETAPA 4
    // =========================================================

    function renderStep4() {
      return `
        <section class="fade-in">
          <div class="mb-7 text-center">
            <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-indigo-50 text-3xl">
              🔐
            </div>

            <span class="text-xs font-bold uppercase tracking-wider text-indigo-600">
              ETAPA 4 DE 5 · Confirmação de Usuário
            </span>

            <h2 class="mt-3 text-2xl font-bold text-gray-900">
              Confirme seu perfil
            </h2>

            <p class="mt-2 text-sm leading-6 text-gray-500">
              Insira seu código de usuário ou nome de usuário da plataforma.
            </p>
          </div>

          <form id="usernameForm" class="space-y-5">

            <div>
              <label class="mb-2 block text-sm font-semibold text-gray-700">
                Código / Username
              </label>

              <input
                id="username"
                type="text"
                value="${escapeHTML(state.form.username)}"
                placeholder="ex: user_12345"
                required
                class="w-full rounded-xl border border-gray-200 bg-gray-50 px-4 py-4 text-sm outline-none transition focus:border-indigo-500 focus:bg-white focus:ring-4 focus:ring-indigo-100"
              />
            </div>

            <div class="rounded-xl bg-indigo-50 p-4">
              <p class="text-xs leading-5 text-indigo-700">
                Seus dados serão utilizados apenas para preparar seu resultado personalizado.
              </p>
            </div>

            <button
              type="submit"
              class="w-full rounded-xl bg-indigo-600 py-4 text-sm font-bold text-white shadow-lg shadow-indigo-200 transition hover:bg-indigo-700 active:scale-[0.98]"
            >
              CONTINUAR
            </button>
          </form>
        </section>
      `;
    }

    // =========================================================
    // PROCESSAMENTO
    // =========================================================

    function renderProcessing() {
      const items = [
        "Validando respostas...",
        "Analisando perfil...",
        "Gerando resultado..."
      ];

      return `
        <section class="py-8 text-center fade-in">
          <div class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-full bg-indigo-50">
            <div class="h-10 w-10 animate-spin rounded-full border-4 border-gray-200 border-t-indigo-600"></div>
          </div>

          <h2 class="text-2xl font-bold text-gray-900">
            Processando suas respostas...
          </h2>

          <p class="mt-2 text-sm text-gray-500">
            Estamos preparando seu resultado personalizado.
          </p>

          <div class="mt-8 space-y-3 text-left">
            ${items.map((item, index) => {
              const completed = state.processIndex > index;
              const active = state.processIndex === index;

              return `
                <div class="flex items-center gap-3 rounded-xl border p-4 transition-all duration-500 ${
                  completed
                    ? "border-green-100 bg-green-50"
                    : "border-gray-100 bg-gray-50"
                }">
                  <div class="flex h-7 w-7 items-center justify-center rounded-full text-xs font-bold ${
                    completed
                      ? "bg-green-500 text-white"
                      : "bg-white text-gray-400"
                  }">
                    ${completed ? "✓" : index + 1}
                  </div>

                  <span class="text-sm font-medium ${
                    completed ? "text-green-700" : "text-gray-500"
                  }">
                    ${item}
                  </span>

                  ${
                    active && !completed
                      ? `<div class="ml-auto h-4 w-4 animate-spin rounded-full border-2 border-gray-200 border-t-indigo-500"></div>`
                      : ""
                  }
                </div>
              `;
            }).join("")}
          </div>
        </section>
      `;
    }

    // =========================================================
    // ETAPA 5
    // =========================================================

    function renderStep5() {
      return `
        <section class="fade-in">
          <div class="mb-6 overflow-hidden rounded-2xl border border-green-200">
            <div class="bg-green-500 px-5 py-4 text-center text-sm font-bold text-white">
              ✓ PERFIL GERADO COM SUCESSO!
            </div>

            <div class="bg-green-50 p-5 text-center">
              <div class="mx-auto mb-3 flex h-14 w-14 items-center justify-center rounded-full bg-green-100 text-2xl">
                🎉
              </div>

              <h2 class="text-xl font-bold text-gray-900">
                Parabéns, ${escapeHTML(state.form.name)}!
              </h2>

              <p class="mt-2 text-sm text-gray-600">
                Suas respostas foram salvas.
              </p>
            </div>
          </div>

          <div class="text-center">
            <h3 class="text-lg font-bold text-gray-900">
              Seu resultado está pronto
            </h3>

            <p class="mx-auto mt-2 max-w-md text-sm leading-6 text-gray-500">
              Assista ao vídeo abaixo para ver a explicação detalhada do seu resultado.
            </p>

            <button
              id="watchVideoBtn"
              class="mt-7 w-full rounded-xl bg-green-500 py-4 text-sm font-bold text-white shadow-lg shadow-green-100 transition hover:bg-green-600 active:scale-[0.98]"
            >
              ► ASSISTIR VÍDEO DO RESULTADO
            </button>
          </div>

          <div class="mt-6 flex flex-wrap justify-center gap-2">
            <span class="rounded-full bg-gray-100 px-3 py-1 text-xs text-gray-500">
              Categoria: ${escapeHTML(state.form.category)}
            </span>

            <span class="rounded-full bg-gray-100 px-3 py-1 text-xs text-gray-500">
              Tópico: ${escapeHTML(state.form.topic)}
            </span>
          </div>
        </section>
      `;
    }

    // =========================================================
    // PÁGINA DO VÍDEO
    // =========================================================

    function renderVideoPage() {
      return `
        <div class="min-h-screen bg-gray-100 px-4 py-6 sm:py-10">
          <div class="mx-auto w-full max-w-3xl overflow-hidden rounded-2xl bg-white shadow-xl">

            <header class="border-b border-gray-100 px-5 py-5 sm:px-7">
              <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                  <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-indigo-600 text-xl text-white">
                    ★
                  </div>

                  <div>
                    <h1 class="text-lg font-bold text-gray-900">QuizApp</h1>
                    <p class="text-xs text-gray-500">Seu resultado</p>
                  </div>
                </div>

                <span class="rounded-full bg-green-50 px-3 py-1.5 text-xs font-bold text-green-600">
                  ✓ Status: Concluído
                </span>
              </div>
            </header>

            <main class="px-5 py-7 sm:px-7 sm:py-9">

              <div class="mb-6">
                <h2 class="text-2xl font-bold text-gray-900">
                  Olá, ${escapeHTML(state.form.name)}!
                </h2>

                <p class="mt-2 text-sm text-gray-500">
                  Assista à análise completa do seu perfil.
                </p>
              </div>

              <div class="relative aspect-video w-full overflow-hidden rounded-2xl bg-black shadow-lg">

                ${
                  VIDEO_EMBED_URL.includes("SEU_VIDEO_AQUI")
                    ? `
                      <div class="absolute inset-0 flex items-center justify-center p-6 text-center text-white">
                        <div>
                          <div class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-white/10 text-3xl">
                            ▶
                          </div>
                          <p class="text-sm font-semibold">
                            Seu vídeo aparecerá aqui
                          </p>
                          <p class="mt-2 text-xs text-gray-400">
                            Edite a variável VIDEO_EMBED_URL no início do arquivo.
                          </p>
                        </div>
                      </div>
                    `
                    : `
                      <iframe
                        class="absolute inset-0 h-full w-full"
                        src="${escapeHTML(VIDEO_EMBED_URL)}"
                        title="Vídeo do resultado"
                        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                        allowfullscreen
                      ></iframe>
                    `
                }

              </div>

              <div class="mt-5 flex gap-3 rounded-xl border border-amber-100 bg-amber-50 p-4">
                <div class="text-xl">⚠️</div>

                <p class="text-sm leading-6 text-amber-800">
                  <strong>Importante:</strong> assista ao vídeo até o final para entender a análise completa do seu perfil.
                </p>
              </div>

            </main>

            <footer class="border-t border-gray-100 px-5 py-5 text-center">
              <p class="text-xs text-gray-400">
                © 2026 Todos os direitos reservados.
              </p>
            </footer>

          </div>
        </div>
      `;
    }

    // =========================================================
    // RENDER PRINCIPAL
    // =========================================================

    function render() {
      let html = "";

      if (state.step === 1) {
        html = layout(renderStep1());
      } else if (state.step === 2) {
        html = layout(renderStep2());
      } else if (state.step === 3) {
        html = layout(renderStep3());
      } else if (state.step === 4) {
        html = layout(renderStep4());
      } else if (state.step === "processing") {
        html = layout(renderProcessing());
      } else if (state.step === 5) {
        html = layout(renderStep5());
      } else if (state.step === "video") {
        html = renderVideoPage();
      }

      document.getElementById("app").innerHTML = html;
      bindEvents();
    }

    // =========================================================
    // EVENTOS
    // =========================================================

    function bindEvents() {

      // Etapa 1
      const startForm = document.getElementById("startForm");

      if (startForm) {
        startForm.addEventListener("submit", function(e) {
          e.preventDefault();

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();

          if (!name || !email) {
            alert("Preencha seu nome e e-mail para continuar.");
            return;
          }

          state.form.name = name;
          state.form.email = email;

          const selectedCategory = document.querySelector(
            'input[name="category"]:checked'
          );

          if (selectedCategory) {
            state.form.category = selectedCategory.value;
          }

          state.step = 2;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }

      // Radio buttons
      document.querySelectorAll('input[name="category"]').forEach(input => {
        input.addEventListener("change", function() {
          state.form.category = this.value;
          render();
        });
      });

      // Etapa 2
      document.querySelectorAll("[data-answer]").forEach(button => {
        button.addEventListener("click", function() {
          const number = Number(this.dataset.answer);

          state.selectedNumber = number;

          if (state.attempt === 0) {
            state.attempt = 1;
            state.answerStatus = "wrong";
            render();
          } else {
            state.answerStatus = "correct";
            render();

            setTimeout(() => {
              state.step = 3;
              state.answerStatus = null;
              state.selectedNumber = null;
              state.attempt = 0;
              render();
            }, 1200);
          }
        });
      });

      const retryBtn = document.getElementById("retryBtn");

      if (retryBtn) {
        retryBtn.addEventListener("click", function() {
          state.answerStatus = null;
          state.selectedNumber = null;
          render();
        });
      }

      // Etapa 3
      document.querySelectorAll("[data-topic]").forEach(button => {
        button.addEventListener("click", function() {
          state.form.topic = this.dataset.topic;
          render();

          setTimeout(() => {
            state.step = 4;
            render();
          }, 350);
        });
      });

      // Etapa 4
      const usernameForm = document.getElementById("usernameForm");

      if (usernameForm) {
        usernameForm.addEventListener("submit", function(e) {
          e.preventDefault();

          const username = document.getElementById("username").value.trim();

          if (!username) {
            alert("Digite seu código ou username.");
            return;
          }

          state.form.username = username;
          startProcessing();
        });
      }

      // Resultado
      const watchVideoBtn = document.getElementById("watchVideoBtn");

      if (watchVideoBtn) {
        watchVideoBtn.addEventListener("click", function() {
          state.step = "video";
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        });
      }
    }

    // =========================================================
    // PROCESSAMENTO
    // =========================================================

    function startProcessing() {
      processingTimers.forEach(clearTimeout);
      processingTimers = [];

      state.step = "processing";
      state.processIndex = 0;
      render();

      processingTimers.push(
        setTimeout(() => {
          state.processIndex = 1;
          render();
        }, 900)
      );

      processingTimers.push(
        setTimeout(() => {
          state.processIndex = 2;
          render();
        }, 1800)
      );

      processingTimers.push(
        setTimeout(() => {
          state.processIndex = 3;
          render();
        }, 2700)
      );

      processingTimers.push(
        setTimeout(() => {
          state.step = 5;
          render();
          window.scrollTo({ top: 0, behavior: "smooth" });
        }, 3500)
      );
    }

    // =========================================================
    // INICIALIZAÇÃO
    // =========================================================

    render();
  </script>
</body>
</html>
